[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "callsign"
version = "0.1.0"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
markers = ["gpu: tests that require the GPU + heavy models"]
addopts = "-ra"
